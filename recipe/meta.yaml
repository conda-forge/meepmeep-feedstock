{% set name = "meepmeep" %}
{% set version = "1.2.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/meepmeep-{{ version }}.tar.gz
  sha256: 8c21c249032287ba9abf92c0057723c81f5059422d1a5464021c2e8f23f7d930

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2.0
    - numba >=0.60
    - scipy >=1.10
    - matplotlib-base

test:
  imports:
    - meepmeep
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert version('meepmeep') == '{{ version }}'"
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/hpparvi/MeepMeep
  summary: 'Fast Keplerian orbit computation using Taylor series expansions.'
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hpparvi
